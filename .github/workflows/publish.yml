name: Publish to PyPI

# Dormant, and expected to stay that way until two things are true: the project has been
# registered on PyPI as a trusted publisher for this repository and this workflow file, and
# a GitHub Release has been published.  Neither can be done from here -- see the
# "Manual steps" note below.  Until then this workflow never fires, which is the point: it
# costs nothing to have ready and cannot fail while it is not being used.
#
# Triggering on a published Release rather than on a tag is what makes the act of releasing
# deliberate.  A tag can be pushed by accident; a release is written and published on
# purpose, and it is the same object the changelog entry is attached to.
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # Required for PyPI Trusted Publishing (OIDC).  The runner exchanges a short-lived
    # GitHub-signed token for a PyPI upload token at publish time, so there is no API token
    # stored as a repository secret and nothing to leak or rotate.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build the package (sdist and wheel)
        # Pure Python, so the wheel is universal and one build serves every interpreter in
        # the test matrix.  The sdist matters more than usual for this project: it is what
        # the paper's readers get when they want the source next to the equations.
        run: python -m build

      - name: Check the built distributions
        # `twine check` catches the failure mode that is otherwise only discovered after
        # upload, when it is too late to fix without burning a version number: a README that
        # PyPI's renderer rejects.  This project's README is Markdown with badges and a
        # fenced file tree, which is exactly the kind of thing that renders locally and is
        # refused remotely.
        run: |
          pip install twine
          twine check dist/*

      # - name: Publish package to TestPyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     repository-url: https://test.pypi.org/legacy/
      #
      # A rehearsal of the step below, against https://test.pypi.org, which is a
      # throwaway index that exists for exactly this.  Left commented out rather than
      # guarded by a condition because there is no secret or variable to key it on:
      # trusted publishing carries no token, so dormancy here has to be textual.
      #
      # Worth rehearsing at all because the real upload is unrepeatable.  PyPI refuses a
      # second upload of a version permanently, even after the file is deleted, so a
      # release that fails partway through cannot be retried -- it can only be renumbered.
      # `twine check` above catches a README the renderer will reject, which is the most
      # likely such failure, but it does not exercise the OIDC exchange, the trusted
      # publisher configuration, or the upload itself.
      #
      # To use it:
      #
      #   1. Create a pending publisher at https://test.pypi.org/manage/account/publishing/
      #      -- a separate account and a separate registration from PyPI proper, with the
      #      same four values: nuoscprobexact, mbustama, NuOscProbExact, publish.yml, and
      #      an empty environment name.
      #   2. Uncomment the four lines above, and comment out the PyPI step below, so that
      #      the rehearsal does not become the performance.
      #   3. Publish a GitHub Release and watch it land at
      #      https://test.pypi.org/project/nuoscprobexact/.
      #   4. Restore this file before releasing for real.
      #
      # TestPyPI burns version numbers the same way PyPI does, so rehearse with a version
      # you do not intend to ship -- 1.7.0.dev1 rather than 1.7.0.  It also does not mirror
      # PyPI's dependencies, which does not matter here: numpy is the only requirement and
      # the wheel is universal.

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
