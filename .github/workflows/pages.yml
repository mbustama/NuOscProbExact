name: Documentation Deployment

# Only main is published.  Every other branch has its documentation built and checked by the
# `docs` job in lint.yml, which is the stricter of the two; this one exists to deploy.
on:
  push:
    branches: [ "main" ]
  # Re-publish on demand, from the Actions tab.  A Pages *deployment* can fail
  # server-side after a build that succeeded --- it happened on 2026-08-06,
  # going waiting -> queued -> in_progress -> failure with no description,
  # after six consecutive successes and with nothing deploy-relevant changed
  # --- and `actions/deploy-pages` then spends its ten-minute poll waiting for
  # a success that is never coming and reports only `Timeout reached`.  The
  # site is left serving the previous tree.  Without this trigger the only way
  # back is to push a commit to `main` for no reason other than to redeploy,
  # which is a poor way to fix a transient fault.
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to GitHub Pages.  `id-token: write` is what
# lets actions/deploy-pages authenticate without a stored secret.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, skipping any run queued behind the latest.  Unlike the test
# workflow this does cancel in progress on main: two merges in quick succession should
# publish the newer tree, not race to see which finishes last.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the docs job in lint.yml, so what was checked is what gets deployed.
          python-version: "3.12"

      - name: Install documentation dependencies and the package
        # docs/requirements.txt is `-e .[docs]`, so this installs the package
        # editable along with the documentation dependencies.  The editable
        # install is required, not merely convenient: jupyter-sphinx executes
        # the `.. jupyter-execute::` blocks in a real kernel, which is a
        # separate process, and the `sys.path.insert` in docs/source/conf.py
        # applies to Sphinx itself and never reaches that kernel.
        run: pip install -r docs/requirements.txt

      - name: Register the Jupyter kernel used by jupyter-sphinx
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Build HTML documentation
        # Deliberately without -W, unlike the docs job in lint.yml.  That job is the gate and
        # runs on every branch; making the deploy strict as well would mean a warning
        # introduced by a new Sphinx release could block publication of documentation that
        # is otherwise correct, at the least convenient moment.
        run: |
          cd docs
          make html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload HTML artifact
        # This action stopped including dotfiles in v4, which is worth knowing because a
        # Sphinx tree can contain two that matter.  Checked rather than assumed: the build
        # here produces exactly one, `.buildinfo`, which is Sphinx's incremental-build cache
        # -- its own header says a full rebuild happens when it is absent, and CI builds
        # from scratch every time, so losing it changes nothing.  There is no `.nojekyll`,
        # and none is needed: deploying through Actions serves the artifact as-is rather
        # than passing it to Jekyll, which is why the `_static/` directory loads today
        # despite the leading underscore.  If a future page ever does need a dotfile, v5
        # added an `include-hidden-files` input.
        uses: actions/upload-pages-artifact@v5
        with:
          # Where docs/Makefile puts the build: BUILDDIR = build, and `make html` goes
          # through sphinx-build -M, which appends the builder name.
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
