name: Code Quality

# Triggers match tests.yml exactly; the reasoning is written out there.  In short: a commit
# is checked once, the push-triggered run is what appears on a pull request, and
# pull_request events are kept only so that a fork's branches -- which never fire a push
# event here -- are still covered.
on:
  push:
    # '**' matches every branch, including names containing a slash, and has to be spelled
    # out.  A push filter naming only tags -- even `tags-ignore: ['**']` -- makes GitHub
    # treat the workflow as tag-only and run it for no branch push at all.
    branches: ['**']
  pull_request:
  # Re-run on demand, from the Actions tab.  When Actions itself is unwell --- as on
  # 2026-08-06, when runs sat queued for hours and were cancelled out from under us by
  # the infrastructure --- the alternative is pushing a commit to a branch for no reason
  # but to re-trigger.  `pages.yml` gained this for the same reason.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Whether anything outside the paper changed.  `resources/paper/**` holds the
  # LaTeX source of the article and its figures; editing it cannot affect any
  # result the suite checks, and the paper is edited far more often than the
  # code.  The heavy steps below are guarded on this.
  #
  # The jobs themselves are NOT skipped, and that is deliberate.  A job skipped
  # by `if:` -- or a workflow skipped by a `paths` filter -- may never report
  # its check, and the branch ruleset on `main` requires nine of these by name;
  # a required check that never reports leaves a pull request pending forever
  # rather than failing.  Running the job and doing nothing in it costs about
  # fifteen seconds and keeps every check reporting as before.
  #
  # `tests/test_file_tree.py` is exempt: it asserts the tracked file list, so
  # *adding or removing* a file under resources/paper does change what it
  # checks, even though editing one does not.  It is run unconditionally below.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        # Fails safe: anything unexpected -- a new branch, a force push, a
        # missing base -- reports `code=true` and the full suite runs.
        run: |
          base=''
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
          elif [ "${{ github.event.before }}" != '0000000000000000000000000000000000000000' ]; then
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'no usable base; running everything'
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" '${{ github.sha }}')
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qvE '^resources/paper/'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'only the paper changed; heavy steps will be skipped'
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Run Ruff Linter
    # `always()` so that a failure of the `changes` job cannot withdraw this
    # check: a required check that never reports blocks a pull request
    # instead of failing it.  The step guards below then fall back to
    # running everything, since an absent output is not 'false'.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: needs.changes.outputs.code != 'false'
        run: pip install ruff

      - name: Run Ruff Linter
        if: needs.changes.outputs.code != 'false'
        # Undefined names, unused imports, comparison and except-clause mistakes.  The rule
        # selection, the two codebase-wide exemptions (E741 for `l`, E701 for the d_ijk
        # lookup table) and the star-import exemption for the paper's worked examples all
        # live in [tool.ruff.lint] in pyproject.toml, so this command and a local `ruff
        # check` cannot disagree.
        #
        # Blocking on purpose: a new finding should fail the build rather than be reported
        # into a green checkmark.  The codebase is clean against this selection as of the
        # commit that introduced it, so anything this reports is new.
        run: ruff check src/ tests/ examples/ docs/ notebooks/

      - name: Run Ruff Formatter (Check Only)
        if: needs.changes.outputs.code != 'false'
        # Informational, and expected to stay that way.  The codebase predates ruff format
        # and does not follow it -- 35 of 39 files would be reformatted -- and running it
        # would rewrite the alignment of the SU(3) coefficient blocks and the d_ijk table,
        # which are laid out to be read against the equations rather than to please a
        # formatter.  Left here so the gap stays visible without blocking anything.
        run: ruff format --check .
        continue-on-error: true

  docs:
    name: Documentation builds
    # `always()` so that a failure of the `changes` job cannot withdraw this
    # check: a required check that never reports blocks a pull request
    # instead of failing it.  The step guards below then fall back to
    # running everything, since an absent output is not 'false'.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@v7
        with:
          # Matches pages.yml, so what is checked here is what gets deployed.
          python-version: "3.12"

      - name: Install documentation dependencies and the package
        if: needs.changes.outputs.code != 'false'
        # docs/requirements.txt is `-e .[docs]`, so this installs the package
        # editable along with the documentation dependencies.  The editable
        # install is required, not merely convenient: jupyter-sphinx executes
        # the `.. jupyter-execute::` blocks in a real kernel, which is a
        # separate process, and the `sys.path.insert` in docs/source/conf.py
        # applies to Sphinx itself and never reaches that kernel.
        run: pip install -r docs/requirements.txt

      - name: Register the Jupyter kernel used by jupyter-sphinx
        if: needs.changes.outputs.code != 'false'
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Build HTML documentation
        if: needs.changes.outputs.code != 'false'
        # Stricter than pages.yml on purpose.  -W turns Sphinx warnings into errors, which
        # is what catches a broken cross-reference, a page missing from the toctree, a
        # numpydoc section that does not parse, or an autodoc target that has been renamed
        # out from under the docs.  --keep-going reports all of them in one run instead of
        # stopping at the first.
        #
        # The documentation builds clean under -W today and this is what keeps it that way.
        # Until now it was only ever built by the deployment workflow, which runs on pushes
        # to main -- so a page that failed to build was discovered after it had merged.
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"

  notebooks:
    name: Notebooks execute
    # `always()` so that a failure of the `changes` job cannot withdraw this
    # check: a required check that never reports blocks a pull request
    # instead of failing it.  The step guards below then fall back to
    # running everything, since an absent output is not 'false'.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        # The `fast` extra is included so the notebooks run against the compiled
        # backend, which is what a reader following the Performance section will have.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[notebooks,fast]'

      - name: Execute every notebook
        if: needs.changes.outputs.code != 'false'
        # Blocking, and the reason is the whole point of the job: a notebook is
        # documentation that claims to work.  The stored outputs make that claim
        # persuasive without being evidence -- they were true whenever the notebook was
        # last run, which may predate the API change that broke it.  Running them here
        # is what makes the claim checkable.
        #
        # Executed into a throwaway copy rather than in place: a notebook whose stored
        # outputs differ from a fresh run is not a failure (figures are not
        # reproducible bit-for-bit across matplotlib versions), so nothing is written
        # back and the working tree stays clean.
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import nbformat
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError

          failed = []
          for path in sorted(pathlib.Path('notebooks').glob('*.ipynb')):
              nb = nbformat.read(path, as_version=4)
              try:
                  NotebookClient(
                      nb, timeout=1800, kernel_name='python3',
                      resources={'metadata': {'path': str(path.parent)}}).execute()
                  print('ok    %s' % path.name)
              except CellExecutionError as error:
                  failed.append(path.name)
                  print('FAIL  %s\n%s' % (path.name, error))

          if failed:
              sys.exit('notebooks failed to execute: %s' % ', '.join(failed))
          PY

      - name: Run the worked examples
        if: needs.changes.outputs.code != 'false'
        # The nine scripts in examples/ are the ones the paper walks through and the
        # ones README.md walks through line by line.  Nothing executed them, so
        # they could rot silently -- and had: two were referenced under names
        # that no longer existed.  They are cheap to run and they print
        # probabilities, so running them is the cheapest possible check that the
        # library still does what the paper says.
        run: |
          cd examples
          for example in example_*.py; do
            echo "--- $example"
            python "$example" > /dev/null || exit 1
          done
          echo "all worked examples ran"

      - name: Check every notebook ships its figures
        if: needs.changes.outputs.code != 'false'
        # The notebooks are committed with their outputs, so that GitHub renders them
        # without anyone having to run anything.  A notebook stripped of its outputs
        # still executes and would pass the step above while showing a reader nothing.
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import nbformat

          bare = []
          for path in sorted(pathlib.Path('notebooks').glob('*.ipynb')):
              nb = nbformat.read(path, as_version=4)
              code = [c for c in nb.cells if c.cell_type == 'code']
              if not any(c.get('outputs') for c in code):
                  bare.append(path.name)

          if bare:
              sys.exit('notebooks carry no stored outputs: %s' % ', '.join(bare))
          print('all %d notebooks carry stored outputs'
                % len(list(pathlib.Path('notebooks').glob('*.ipynb'))))
          PY
